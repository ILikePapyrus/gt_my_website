<!DOCTYPE html>

<html lang="it">
    <head>
        <!-- Titolo scheda -->
        <title>A Spotify Embed Example</title>
        <!-- Meta -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
        <!-- CSS -->
        <link rel="stylesheet" href="../css/embed_spotify.css"/>
    </head>

    <body>
        <h1>Spotify Embed</h1>
        <br>
        <p>Utilizzo dell'API di Spotify per l'integrazione di un Embed che riproduce un podcast.</p>
        <br>
        <div class="test">
            <div class="episodes">
                <!-- Lista degli episodi selezionabili -->
                <ul class="list-group scrollable-list">
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:3j7nlaMvFadMLlJtKbOxz9">
                            M
                        </button>
                    </li>
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:38w4r42RyXKOYd5iaNkt9A">
                            A
                        </button>
                    </li>
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:7DRgFNI4RSn4rtMhCiSJha">
                            R
                        </button>
                    </li>
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:2TObPUbKB6DWgnVGHfMoal">
                            C
                        </button>
                    </li>
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:7At2TIApR0k0j1yeRJxYqc">
                            O
                        </button>
                    </li>
                    <li class="list-group-item list-group-item-action">
                        <button class="episode" data-spotify-id="spotify:episode:1i83799Ji15UvwRQv44KJr">
                            USF0JSN+Kyt4UQ==
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Embed Spotify -->
            <div id="embed-iframe"></div>
            <!-- Import API Embed Spotify -->
            <script src="https://open.spotify.com/embed/iframe-api/v1" async> </script>
            <!-- JS -->
            <script type="text/javascript">
                window.onSpotifyIframeApiReady = (IFrameAPI) => {
                    // Assegna dove sarà inserito l'Embed
                    const element = document.getElementById('embed-iframe');
                    // Opzioni dell'elemento Embed
                    const options = {
                        width: '100%',
                        height: '160',
                        uri: 'spotify:episode:3j7nlaMvFadMLlJtKbOxz9' // URI episodio iniziale
                    };
                    const callback = (EmbedController) => {
                        // Raggruppa tutti gli elementi di classe 'episode'
                        document.querySelectorAll('.episode').forEach(
                            episode => {
                                // Aggiungi un listener per un click sul pulsante
                                episode.addEventListener('click', () => {
                                    // Quando viene cliccato il pulsante carica l'URI dell'episodio salvato
                                    EmbedController.loadUri(episode.dataset.spotifyId)
                                });
                            }
                        )
                    };
                    // Crea l'embed
                    IFrameAPI.createController(element, options, callback);
                };
            </script>
        </div>
    </body>
</html>
